services:
  postgres:
    image: postgres:17-alpine
    container_name: rubys-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: rubys_admin
      POSTGRES_PASSWORD: rubys_local_password
      POSTGRES_DB: rubys_db

    ports:
      - "5432:5432"

    volumes:
      - rubys_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubys_admin -d rubys_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rubys_postgres_data: