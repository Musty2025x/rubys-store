
name: RUBYS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build, Validate and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DIRECT_URL: postgresql://build:build@localhost:5432/build

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Application image metadata
      - name: Extract application image metadata
        id: app_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/musty2025x/rubys-store
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Build and publish Next.js application
      - name: Build and publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      # Migrator image metadata
      - name: Extract migrator image metadata
        id: migrator_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/musty2025x/rubys-store-migrator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Build and publish Prisma migrator
      - name: Build and publish migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.migrator_meta.outputs.tags }}
          labels: ${{ steps.migrator_meta.outputs.labels }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max
      
      # Seeder image metadata
      - name: Extract seeder image metadata
        id: seeder_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/musty2025x/rubys-store-seeder
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Build and publish RUBYS product seeder
      - name: Build and publish seeder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: seeder
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.seeder_meta.outputs.tags }}
          labels: ${{ steps.seeder_meta.outputs.labels }}
          cache-from: type=gha,scope=seeder
          cache-to: type=gha,scope=seeder,mode=max
