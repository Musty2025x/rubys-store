name: RUBYS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build, Validate and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DIRECT_URL: postgresql://build:build@localhost:5432/build

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Application image metadata
      - name: Extract application image metadata
        id: app_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/musty2025x/rubys-store
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      - name: Build and publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      # Migrator image metadata
      - name: Extract migrator image metadata
        id: migrator_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/musty2025x/rubys-store-migrator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      - name: Build and publish migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.migrator_meta.outputs.tags }}
          labels: ${{ steps.migrator_meta.outputs.labels }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

      # Seeder image metadata
      - name: Extract seeder image metadata
        id: seeder_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/musty2025x/rubys-store-seeder
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and publish RUBYS product seeder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: seeder
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.seeder_meta.outputs.tags }}
          labels: ${{ steps.seeder_meta.outputs.labels }}
          cache-from: type=gha,scope=seeder
          cache-to: type=gha,scope=seeder,mode=max

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      # Temporary diagnostic: inspect GitHub's OIDC claims without printing the token
      - name: Diagnose GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          PAYLOAD=$(TOKEN="$TOKEN" python3 -c '
          import os, json, base64
          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload))))
          ')

          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            ref,
            event_name
          }'

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy application through AWS Systems Manager
        shell: bash
        env:
          INSTANCE_ID: i-0afef0e2c50ea4e53
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -Eeuo pipefail

          DEPLOY_SCRIPT=$(cat <<EOF
          set -eu

          cd /home/ubuntu/rubys-deployment

          export RUBYS_IMAGE_TAG="${IMAGE_TAG}"

          echo "Pulling application and migration images: \${RUBYS_IMAGE_TAG}"

          docker compose -f docker-compose.ec2.yml pull app migrator

          echo "Applying database migrations"

          docker compose -f docker-compose.ec2.yml --profile migration run --rm migrator

          echo "Restarting application"

          docker compose -f docker-compose.ec2.yml up -d app caddy

          echo "Checking application health"

          for attempt in \$(seq 1 30); do
            if curl -fsS https://rubys.mustydevops.com.ng/ >/dev/null; then
              echo "RUBYS deployment successful"
              exit 0
            fi

            echo "Health check attempt \${attempt}/30 failed; retrying"
            sleep 5
          done

          echo "Application health check failed"
          docker logs --tail 100 rubys-app
          exit 1
          EOF
          )

          PARAMETERS=$(jq -cn --arg script "$DEPLOY_SCRIPT" '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 900 \
            --comment "RUBYS deployment $GITHUB_SHA" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment command."
          exit 1